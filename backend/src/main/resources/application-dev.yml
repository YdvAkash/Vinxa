spring:
  datasource:
    url: jdbc:h2:mem:vinxadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false # Disabled in mem-dev, enabled in PostgreSQL prod

vinxa:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  audio:
    sample-rate: 16000
    ticket-expiry-seconds: 60
  deepgram:
    api-key: ${DEEPGRAM_API_KEY:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
